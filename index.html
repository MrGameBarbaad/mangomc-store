<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangoMC Store | Fire Style</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d0d0d; color: white; font-family: 'Inter', sans-serif; }
        .fire-gradient { background: linear-gradient(135deg, #ff8c00 0%, #ffc107 100%); }
        .nav-link { color: #999; font-weight: 600; transition: 0.3s; }
        .nav-link:hover { color: #ff8c00; }
        .item-card { 
            background: #151515; 
            border: 1px solid #222; 
            transition: transform 0.2s, border-color 0.2s;
        }
        .item-card:hover { 
            border-color: #ff8c00; 
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

    <div class="bg-black py-2 border-b border-zinc-800 text-center">
        <p class="text-xs font-bold tracking-widest text-zinc-400">
            SERVER IP: <span class="text-orange-500 cursor-pointer" onclick="navigator.clipboard.writeText('play.mangomc.net'); alert('IP Copied!')">PLAY.MANGOMC.NET</span>
        </p>
    </div>

    <header class="flex flex-col items-center py-12">
        <img src="logo.png" alt="Logo" class="w-32 mb-4 drop-shadow-2xl">
        <h1 class="text-4xl font-black uppercase tracking-tighter italic">Mango<span class="text-orange-500">MC</span> Store</h1>
    </header>

    <nav class="flex justify-center gap-8 mb-12 border-y border-zinc-800 py-4 bg-[#111]">
        <a href="#" class="nav-link text-orange-500">RANKS</a>
        <a href="#" class="nav-link">KEYS</a>
        <a href="#" class="nav-link">ITEMS</a>
        <a href="#" class="nav-link">UNBANS</a>
    </nav>

    <main class="max-w-6xl mx-auto px-6 pb-20">
        <h2 class="text-2xl font-bold mb-8 border-l-4 border-orange-500 pl-4 uppercase italic">Top Ranks</h2>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            
            <div class="item-card rounded-xl p-6 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-zinc-800 rounded-full mb-4 flex items-center justify-center">
                    <span class="text-3xl">⭐</span>
                </div>
                <h3 class="text-xl font-black uppercase">VIP Rank</h3>
                <p class="text-zinc-500 text-sm mt-2 mb-6">Fly, Green Name, & 2x Multiplier</p>
                <div class="mt-auto w-full">
                    <div class="text-lg font-bold text-orange-400 mb-4">$5,000 / 50 Coins</div>
                    <button onclick="order('VIP Rank', '$5,000')" class="fire-gradient w-full py-3 rounded-lg text-black font-extrabold uppercase text-sm shadow-lg active:scale-95 transition">Purchase</button>
                </div>
            </div>

            <div class="item-card rounded-xl p-6 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-zinc-800 rounded-full mb-4 flex items-center justify-center">
                    <span class="text-3xl">🔥</span>
                </div>
                <h3 class="text-xl font-black uppercase">MVP Rank</h3>
                <p class="text-zinc-500 text-sm mt-2 mb-6">All VIP perks + Nickname access</p>
                <div class="mt-auto w-full">
                    <div class="text-lg font-bold text-orange-400 mb-4">$15,000 / 150 Coins</div>
                    <button onclick="order('MVP Rank', '$15,000')" class="fire-gradient w-full py-3 rounded-lg text-black font-extrabold uppercase text-sm shadow-lg active:scale-95 transition">Purchase</button>
                </div>
            </div>

            <div class="item-card rounded-xl p-6 flex flex-col items-center text-center">
                <div class="w-20 h-20 bg-zinc-800 rounded-full mb-4 flex items-center justify-center">
                    <span class="text-3xl">👑</span>
                </div>
                <h3 class="text-xl font-black uppercase">Legend Rank</h3>
                <p class="text-zinc-500 text-sm mt-2 mb-6">Access to /god and exclusive kits</p>
                <div class="mt-auto w-full">
                    <div class="text-lg font-bold text-orange-400 mb-4">$50,000 / 500 Coins</div>
                    <button onclick="order('Legend Rank', '$50,000')" class="fire-gradient w-full py-3 rounded-lg text-black font-extrabold uppercase text-sm shadow-lg active:scale-95 transition">Purchase</button>
                </div>
            </div>

        </div>
    </main>

    <script>
        function order(item, price) {
            const user = prompt("Enter your Minecraft Username:");
            if (user) {
                alert("Thank you " + user + "! Our staff will contact you in-game to deduct " + price + " and give your rank.");
                // Add your Discord Webhook logic here later!
            }
        }
    </script>

</body>
</html>
