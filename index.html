<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MangoMC | Official Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap');
        body { background-color: #151518; color: white; font-family: 'Montserrat', sans-serif; margin: 0; overflow-x: hidden; }

        /* LOGIN OVERLAY */
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(rgba(0,0,0,0.9), rgba(0,0,0,0.9)), url('background.png'); background-size: cover; }

        /* HERO SECTION */
        .hero-section { height: 575px; position: relative; display: flex; align-items: center; justify-content: center; background-image: linear-gradient(rgba(0,0,0,0.3), rgba(21,21,24,1)), url('background.png'); background-size: cover; background-position: center bottom; }
        .main-logo { width: 575px; z-index: 10; animation: logoPulse 1.5s ease-in-out infinite alternate; }
        @keyframes logoPulse { 0% { transform: scale(1); } 100% { transform: scale(1.06); } }
        
        /* STATUS BUBBLES */
        .status-container { position: relative; width: 50px; height: 85px; display: flex; align-items: center; justify-content: center; }
        .count-bubble { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); background: #f97316; color: #000; font-weight: 900; font-size: 11px; padding: 3px 20px; border-radius: 20px; z-index: 30; white-space: nowrap; box-shadow: 0 4px 22px rgba(249, 115, 22, 0.7); border: 2px solid #151518; }
        
        .header-ip-box { position: absolute; bottom: 1px; left: 3%; display: flex; align-items: center; gap: 15px; cursor: pointer; }
        .header-discord-box { position: absolute; bottom: 1px; right: 3%; display: flex; align-items: center; gap: 15px; cursor: pointer; text-align: right; }
        .info-text-main { color: #f97316; font-weight: 900; font-size: 18px; text-transform: uppercase; line-height: 1.1; }
        .info-text-sub { color: #ffffff; font-weight: 700; font-size: 12px; text-transform: uppercase; opacity: 0.8; }

        /* SIDEBAR */
        .sidebar-container { background: #1e1e22; border-radius: 8px; overflow: hidden; border: 1px solid #2d2d33; }
        .sidebar-header { padding: 25px 20px 15px; text-align: center; border-bottom: 1px solid #2d2d33; }
        .sidebar-header h3 { color: #f97316; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .sidebar-btn { position: relative; display: flex; align-items: center; padding: 20px 15px; cursor: pointer; transition: all 0.3s ease; background: rgba(255,255,255,0.02); border-bottom: 1px solid #151518; }
        .sidebar-icon-box { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; margin-right: 15px; }
        .sidebar-label { font-weight: 800; font-size: 15px; color: #d1d1d1; }
        .side-img { width: 60px; height: 60px; object-fit: contain; }

        /* CART SLIDE-OUT */
        .side-menu { position: fixed; top: 0; right: -450px; width: 350px; height: 100%; background: #1e1e22; border-left: 2px solid #f97316; z-index: 1000; transition: 0.4s; padding: 25px; box-shadow: -10px 0 30px rgba(0,0,0,0.5); overflow-y: auto; }
        .side-menu.active { right: 0; }
        .input-field { background: #111; border: 1px solid #333; padding: 12px; border-radius: 4px; width: 100%; outline: none; color: white; font-weight: bold; margin-bottom: 15px; font-size: 12px; }
        .toggle-btn { padding: 8px; border-radius: 4px; font-size: 10px; font-weight: 900; border: 1px solid #2d2d33; cursor: pointer; flex: 1; text-align: center; background: transparent; color: white; transition: 0.2s; text-transform: uppercase; }
        .toggle-btn.active { background: #f97316; color: black; border-color: #f97316; }

        /* BUTTONS */
        .fire-btn { background: #f97316; border-radius: 4px; font-weight: 900; color: #000; padding: 10px 20px; font-size: 11px; text-transform: uppercase; transition: 0.3s; cursor: pointer; border: none; }
    </style>
</head>
<body>

    <div id="login-overlay" style="display: none;">
        <div class="bg-[#1e1e22] p-10 rounded-lg border border-zinc-800 w-full max-w-md text-center">
            <img src="logo.png" class="w-28 mx-auto mb-6">
            <input id="login-ign" type="text" placeholder="MINECRAFT USERNAME" class="input-field">
            <input id="login-email" type="email" placeholder="EMAIL ADDRESS" class="input-field">
            <button onclick="saveLogin()" class="fire-btn w-full py-4">LOG IN</button>
        </div>
    </div>

    <div id="cart-menu" class="side-menu">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-orange-500 font-black italic uppercase text-lg">Your Cart</h2>
            <button onclick="toggleCart(false)" class="text-white text-xl">×</button>
        </div>
        <div class="mb-6">
            <p class="text-[9px] text-orange-500 font-black uppercase mb-2">Select Payment Currency</p>
            <div class="flex gap-2">
                <button onclick="setCurrency('DOLLARS')" id="curr-dollars" class="toggle-btn active">DOLLARS</button>
                <button onclick="setCurrency('COINS')" id="curr-coins" class="toggle-btn">COINS</button>
            </div>
        </div>
        <div id="cart-items" class="space-y-4 mb-6 pt-4 border-t border-zinc-800"></div>
        <div class="mb-6 pt-4 border-t border-zinc-800">
            <p class="text-[9px] text-orange-500 font-black uppercase mb-2">Gift Card / Coupon</p>
            <div class="flex gap-2">
                <input type="text" placeholder="CODE" class="input-field mb-0 py-2">
                <button class="fire-btn py-2">Apply</button>
            </div>
        </div>
        <div class="border-t border-zinc-800 pt-5">
            <div class="flex justify-between font-black text-sm uppercase mb-5">
                <span>Total</span>
                <span id="cart-total" class="text-orange-500">0 Dollars</span>
            </div>
            <button onclick="processCheckout()" class="w-full fire-btn py-4">Complete Checkout</button>
        </div>
    </div>

    <div class="hero-section">
        <div class="absolute top-5 right-5 flex items-center gap-3 cursor-pointer" onclick="toggleCart(true)">
            <div class="text-right">
                <p id="top-display-name" class="text-[10px] font-bold uppercase">Guest</p>
                <p id="cart-count-text" class="text-[9px] text-orange-500 font-black">0 ITEMS IN CART</p>
            </div>
            <img id="top-player-head" src="https://mc-heads.net/avatar/steve/32" class="w-8 h-8 rounded border border-white/20">
        </div>
        <img src="logo.png" class="main-logo">
        <div class="header-ip-box">
            <div class="status-container"><span class="count-bubble" id="mc-count">0</span><img src="ipcopy.png" class="w-full"></div>
            <div><p class="info-text-main">MANGOMC.INFO.GF</p><p class="info-text-sub">IP ADDRESS</p></div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-4 mt-12 grid grid-cols-1 md:grid-cols-4 gap-10 pb-20">
        <aside>
            <div class="sidebar-container">
                <div class="sidebar-header"><h3>Categories</h3></div>
                <div class="sidebar-btn"><div class="sidebar-icon-box"><img src="ranks.png" class="side-img"></div><span class="sidebar-label">Ranks</span></div>
                <div class="sidebar-btn"><div class="sidebar-icon-box"><img src="kits.png" class="side-img"></div><span class="sidebar-label">Kits</span></div>
                <div class="sidebar-btn"><div class="sidebar-icon-box"><img src="coins.png" class="side-img"></div><span class="sidebar-label">Coins</span></div>
                <div class="sidebar-btn border-none"><div class="sidebar-icon-box"><img src="dollars.png" class="side-img"></div><span class="sidebar-label">Dollars</span></div>
            </div>
        </aside>

        <main class="md:col-span-3">
            <div id="home-text">
                <p class="text-orange-500 font-bold uppercase text-[10px] mb-1">WELCOME TO THE OFFICIAL</p>
                <h2 class="text-3xl text-orange-500 font-black uppercase mb-6 italic">MANGOMC STORE</h2>

                <div class="bg-[#1e1e22] border border-zinc-800 p-6 rounded mb-10 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div>
                        <h4 class="text-white font-black uppercase text-sm italic">Redeem Gift Card</h4>
                        <p class="text-zinc-500 text-[10px] font-bold uppercase">Check balance or apply code</p>
                    </div>
                    <div class="flex gap-2 w-full md:w-auto">
                        <input type="text" placeholder="GIFT CARD CODE" class="input-field mb-0 bg-black">
                        <button class="fire-btn">Check</button>
                    </div>
                </div>

                <div class="mb-10 text-center md:text-left">
                    <p class="text-orange-500 font-black text-xs uppercase">Welcome To The Official</p>
                    <p class="text-white font-black text-2xl uppercase italic">MangoMC Server</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        let cart = [], currentCurrency = 'DOLLARS';
        let userData = JSON.parse(localStorage.getItem('mangoUser')) || null;

        window.onload = () => {
            if(!userData) document.getElementById('login-overlay').style.display = 'flex';
            else applyLoginData();
        };

        function saveLogin() {
            const ign = document.getElementById('login-ign').value.trim();
            const email = document.getElementById('login-email').value.trim();
            if(!ign || !email) return;
            userData = { ign, email };
            localStorage.setItem('mangoUser', JSON.stringify(userData));
            document.getElementById('login-overlay').style.display = 'none';
            applyLoginData();
        }

        function applyLoginData() {
            document.getElementById('top-display-name').innerText = userData.ign;
            document.getElementById('top-player-head').src = `https://mc-heads.net/avatar/${userData.ign}/32`;
        }

        function toggleCart(s) { document.getElementById('cart-menu').classList.toggle('active', s); }
        function setCurrency(c) { 
            currentCurrency = c; 
            document.getElementById('curr-dollars').classList.toggle('active', c === 'DOLLARS');
            document.getElementById('curr-coins').classList.toggle('active', c === 'COINS');
            document.getElementById('cart-total').innerText = "0 " + currentCurrency;
        }
    </script>
</body>
</html>
